[project]
name = "leetgpu-challenges"
version = "0.1.0"
description = "Local CUDA and Triton development environment for RTX 5070"
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.2",
    "pypandoc-binary>=1.17",
    "requests>=2.32",
    "torch>=2.7",
    "triton>=3.3",
    "websocket-client>=1.8",
]

[dependency-groups]
test = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
markers = [
    "gpu: requires NVIDIA GPU, CUDA runtime and nvcc",
]

# PyTorch CUDA 12.8 wheel
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100